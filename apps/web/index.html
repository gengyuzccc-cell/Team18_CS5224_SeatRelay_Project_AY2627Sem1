<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>SeatRelay</title>
    <meta name="theme-color" content="#003D7C" />
    <!-- public/favicon.svg and favicon.ico (16 + 32 px) are served next to index.html, so
         /favicon.ico is a real icon rather than the SPA fallback page. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <!-- Runtime configuration (window.__SEATRELAY_ENV__): public/env.js in dev, overwritten by
         tools/scripts/bin/deploy-web.sh (CloudFront) and services/local/nginx/entrypoint.sh. -->
    <script src="/env.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
