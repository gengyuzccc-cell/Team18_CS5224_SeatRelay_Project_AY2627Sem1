name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + property tests (with coverage for core)
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @seatrelay/web build

      - name: Build Lambda bundles (esbuild)
        run: pnpm --filter @seatrelay/aws build

      - name: Audit (high+ only)
        run: pnpm audit --audit-level high
        continue-on-error: true

  sam-validate:
    name: SAM template validation (cfn-lint)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Validate templates
        working-directory: services/aws
        run: |
          for t in templates/auth.yaml templates/app.yaml templates/web.yaml; do
            echo "== $t"; sam validate --lint -t "$t"
          done
