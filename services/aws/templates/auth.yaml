AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >-
  SeatRelay – account-wide, long-lived resources: Cognito user pool (web + tooling clients, classic
  hosted UI), SES sender identity, cost budgets. Deployed ONCE as stack `seatrelay-auth` and never
  torn down during the project (users live here).

Parameters:
  WebCallbackUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173/callback
    Description: OIDC redirect URIs (add the CloudFront URL + /callback after the web stack exists).
  WebLogoutUrls:
    Type: CommaDelimitedList
    Default: http://localhost:5173/
    Description: Allowed post-logout URIs (add the CloudFront URL after the web stack exists).
  SenderEmail:
    Type: String
    Default: ''
    Description: Team mailbox used as SES sender identity (verification mail is sent on creation). Empty = skip.
  BudgetEmail:
    Type: String
    Default: ''
    Description: E-mail for budget notifications. Empty = no budgets.
  MonthlyBudgetUsd:
    Type: Number
    Default: 20
  AnnualBudgetUsd:
    Type: Number
    Default: 60

Conditions:
  HasSenderEmail: !Not [!Equals [!Ref SenderEmail, '']]
  HasBudgetEmail: !Not [!Equals [!Ref BudgetEmail, '']]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: seatrelay-users
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false
      MfaConfiguration: 'OFF'
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: false
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true
      # Cognito's own mailer: 50 e-mails/day/account hard quota (resets 09:00 UTC). Switch to
      # DEVELOPER + SES ARN only after SES production access is granted (plan §2.4).
      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: Your SeatRelay verification code
        EmailMessage: 'Your SeatRelay verification code is {####}.'
      UserPoolTags:
        Project: SeatRelay

  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      CallbackURLs: !Ref WebCallbackUrls
      LogoutURLs: !Ref WebLogoutUrls
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      TokenValidityUnits:
        IdToken: minutes
        AccessToken: minutes
        RefreshToken: days
      IdTokenValidity: 60
      AccessTokenValidity: 60
      RefreshTokenValidity: 30

  # Experiment/tooling client: password grant so k6 / scripts can mint tokens without a browser.
  ToolingClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: tooling
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      TokenValidityUnits:
        IdToken: hours
        AccessToken: hours
        RefreshToken: days
      IdTokenValidity: 12
      AccessTokenValidity: 12
      RefreshTokenValidity: 30

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Sub seatrelay-${AWS::AccountId}
      ManagedLoginVersion: 1

  SenderIdentity:
    Type: AWS::SES::EmailIdentity
    Condition: HasSenderEmail
    Properties:
      EmailIdentity: !Ref SenderEmail

  # Budgets must exclude credits, otherwise the net amount is always 0 while credits last (plan §2.4).
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: seatrelay-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
          IncludeDiscount: true
          IncludeSubscription: true
          IncludeTax: true
          IncludeUpfront: true
          IncludeRecurring: true
          IncludeOtherSubscription: true
          IncludeSupport: true
          UseAmortized: false
          UseBlended: false
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 50, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

  AnnualBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: seatrelay-annual
        BudgetType: COST
        TimeUnit: ANNUALLY
        BudgetLimit:
          Amount: !Ref AnnualBudgetUsd
          Unit: USD
        CostTypes:
          IncludeCredit: false
          IncludeRefund: false
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref BudgetEmail }]

Outputs:
  UserPoolId:
    Value: !Ref UserPool
    Export: { Name: !Sub '${AWS::StackName}-UserPoolId' }
  UserPoolArn:
    Value: !GetAtt UserPool.Arn
    Export: { Name: !Sub '${AWS::StackName}-UserPoolArn' }
  Issuer:
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
    Export: { Name: !Sub '${AWS::StackName}-Issuer' }
  WebClientId:
    Value: !Ref WebClient
    Export: { Name: !Sub '${AWS::StackName}-WebClientId' }
  ToolingClientId:
    Value: !Ref ToolingClient
    Export: { Name: !Sub '${AWS::StackName}-ToolingClientId' }
  HostedUiDomain:
    Description: Classic hosted UI base URL (login + /logout endpoint, plan §2.4)
    Value: !Sub https://seatrelay-${AWS::AccountId}.auth.${AWS::Region}.amazoncognito.com
    Export: { Name: !Sub '${AWS::StackName}-HostedUiDomain' }
  SenderEmail:
    Value: !Ref SenderEmail
    Export: { Name: !Sub '${AWS::StackName}-SenderEmail' }
