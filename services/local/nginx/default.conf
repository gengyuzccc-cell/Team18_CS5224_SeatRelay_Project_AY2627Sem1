# nginx config for the on-prem SPA (same build artefact as CloudFront). /env.js is generated at
# container start from environment variables (see nginx/entrypoint.sh).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location / {
        # SPA deep links -> index.html (mirrors the CloudFront 403/404 -> /index.html rule)
        try_files $uri $uri/ /index.html;
    }
}
